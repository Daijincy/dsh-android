name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub's ubuntu-latest runner ships an Android SDK under $ANDROID_HOME.
      # Accept licenses so AGP can auto-install any missing platform/build-tools.
      - name: Accept Android licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          mkdir -p "$SDK/licenses"
          printf "android-sdk-license-5be876d5\nandroid-sdk-license-519dc5241b58d497c0b49d90a98e9b417fe1e2e\n" > "$SDK/licenses/android-sdk-license"
          printf "android-sdk-preview-license-8481541298\n" > "$SDK/licenses/android-sdk-preview-license"

      - name: Provision Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android-apk
          path: app/build/outputs/apk/debug/*.apk
